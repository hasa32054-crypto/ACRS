name: HASSAN tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numeric dependencies
        run: pip install numpy scipy
      - name: Q-ACRS / HASSAN unit tests
        run: make hassan-test
