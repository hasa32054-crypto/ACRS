<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACRS · نظام الاستجابة السيبرانية المتكيّفة</title>
<meta name="description" content="ACRS: Adaptive Cyber Response System, by Hassan Abdullah Alyenbawi">

</head>
<body>
<title>ACRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one dark "operations room" page — a slowly moving colour field behind frosted-glass panels.
   Single-theme by design (always dark), so every colour is set explicitly below. */
:root{
  --bg:#060a0f; --bg2:#0b1219;
  --text:#e8eef2; --muted:#93a4ae; --faint:#5f707a;
  --acrs:#2fb7e0; --acrs-2:#7fe3ff; --uniform:#f07a45; --breach:#ff4d5e; --alive:#3ddc97;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09); --edge:rgba(255,255,255,.12); --edge-2:rgba(255,255,255,.2);
  --font:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
a{color:var(--acrs-2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acrs-2);outline-offset:3px;border-radius:10px}
.wrap{max-width:72rem;margin:0 auto;padding-inline:clamp(1rem,4vw,2rem)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- moving background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#0d1822 0%,var(--bg) 60%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.o1{width:46vmax;height:46vmax;background:radial-gradient(circle,#1b8fb8 0%,transparent 65%);top:-12vmax;inset-inline-start:-10vmax;animation:drift1 26s ease-in-out infinite alternate}
.o2{width:40vmax;height:40vmax;background:radial-gradient(circle,#c0482f 0%,transparent 65%);bottom:-14vmax;inset-inline-end:-8vmax;opacity:.42;animation:drift2 32s ease-in-out infinite alternate}
.o3{width:30vmax;height:30vmax;background:radial-gradient(circle,#15806a 0%,transparent 65%);top:40%;inset-inline-start:35%;opacity:.3;animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-14vmax,-8vmax) scale(1.15)}}
@keyframes drift3{to{transform:translate(-10vmax,12vmax) scale(.9)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
#net{position:absolute;inset:0;width:100%;height:100%;opacity:.7}

/* ---------- glass + controls ---------- */
.glass{background:linear-gradient(145deg,var(--glass-2),var(--glass));border:1px solid var(--edge);border-radius:var(--r);
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}

@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:.6rem;padding:.85rem 1.35rem;border-radius:999px;
  border:1px solid var(--edge-2);background:rgba(8,14,20,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  cursor:pointer;font-weight:600;font-size:1rem;text-decoration:none;color:var(--text);transition:transform .2s,box-shadow .3s}
.btn:hover{transform:translateY(-2px)}
.btn .glow{position:absolute;inset:-1px;border-radius:inherit;z-index:-1;opacity:.55;filter:blur(14px);transition:opacity .3s}
.btn:hover .glow{opacity:.95}
.btn-primary{border-color:transparent;background:
  linear-gradient(rgba(6,12,18,.82),rgba(6,12,18,.82)) padding-box,
  conic-gradient(from var(--ang),var(--acrs),var(--acrs-2),#1f6f8b,var(--acrs)) border-box;animation:spin 5s linear infinite}
.btn-primary .glow{background:var(--acrs)}
.btn-ghost .glow{background:var(--uniform);opacity:.25}
.btn-ghost:hover .glow{opacity:.55}
@keyframes spin{to{--ang:360deg}}
.btn[disabled]{cursor:default;opacity:.8}
.pill{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--edge-2);color:var(--muted)}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);
  transform:translateX(-120%);animation:sweep 4.5s ease-in-out infinite;pointer-events:none}
@keyframes sweep{60%,100%{transform:translateX(120%)}}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset-inline:0;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px)}
.topbar .in.glass{background:linear-gradient(145deg,rgba(14,22,30,.82),rgba(8,13,18,.78))}
.topbar .in{display:flex;align-items:center;gap:.8rem;justify-content:space-between;margin:.6rem auto 0;max-width:72rem;
  padding:.45rem .55rem .45rem 1rem;border-radius:999px}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:700;letter-spacing:.06em;text-decoration:none;color:var(--text);font-family:var(--mono)}
.brand i{width:.6rem;height:.6rem;border-radius:50%;background:var(--acrs);box-shadow:0 0 12px var(--acrs);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.6}}
.tools{display:flex;align-items:center;gap:.45rem}
.navlink{color:var(--muted);text-decoration:none;font-size:.92rem;padding:.4rem .7rem;border-radius:999px}
.navlink:hover{color:var(--text);background:rgba(255,255,255,.06)}
.icon-btn{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--edge);background:rgba(255,255,255,.05)}
.icon-btn[aria-pressed="true"]{border-color:rgba(61,220,151,.6);box-shadow:0 0 16px rgba(61,220,151,.35)}
.icon-btn svg{width:1.1rem;height:1.1rem}
.lang{position:relative;display:flex;align-items:center;padding:.22rem;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.05);cursor:pointer;direction:ltr}
.lang span{position:relative;z-index:1;min-width:2.3rem;text-align:center;font-weight:600;font-size:.88rem;padding:.25rem .5rem;color:var(--muted);transition:color .3s}
.lang .thumb{position:absolute;top:.22rem;bottom:.22rem;width:calc(50% - .22rem);left:.22rem;border-radius:999px;
  background:linear-gradient(135deg,var(--acrs),#1f7fa3);box-shadow:0 0 18px rgba(47,183,224,.55);transition:left .35s cubic-bezier(.6,.2,.2,1.2)}
.lang[data-lang="ar"] .thumb{left:50%}
.lang[data-lang="en"] .en,.lang[data-lang="ar"] .ar{color:#fff}

/* ---------- hero ---------- */
.hero{padding-block:clamp(7rem,16vw,10rem) clamp(3rem,8vw,5rem);text-align:center}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acrs-2)}
:lang(ar) .eyebrow{letter-spacing:0;font-family:var(--font);font-size:.9rem}
.hero h1{font-family:var(--mono);font-size:clamp(4rem,17vw,9.5rem);letter-spacing:.04em;margin-top:.6rem;
  background:linear-gradient(180deg,#fff 10%,#9fe8ff 60%,#2fb7e0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(47,183,224,.35))}
.fullname{font-size:clamp(1rem,3vw,1.25rem);color:var(--muted);margin-top:.2rem}
.lede{max-width:40rem;margin:1.4rem auto 0;font-size:clamp(1.05rem,3.2vw,1.3rem);color:#d9e3e8}
.sig{margin-top:1.6rem;display:inline-flex;align-items:center;gap:.7rem;color:var(--muted);font-size:.95rem}
.sig::before,.sig::after{content:"";width:2.2rem;height:1px;background:linear-gradient(90deg,transparent,var(--edge-2),transparent)}
.sig b{color:var(--text);font-weight:600}
.simple{max-width:36rem;margin:.8rem auto 0;color:var(--muted);font-size:clamp(.95rem,2.8vw,1.08rem);line-height:1.8}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:2rem}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:3rem;text-align:center}
@media (max-width:720px){.verdict{grid-template-columns:1fr}}
.v{padding:1.5rem 1rem 1.3rem}
.v .pair{font-family:var(--mono);font-weight:600;font-size:clamp(2.2rem,7vw,3rem);direction:ltr;unicode-bidi:isolate}
.v .u{color:var(--uniform)} .v .a{color:var(--acrs-2);text-shadow:0 0 18px rgba(47,183,224,.5)} .v .op{color:var(--faint);margin-inline:.4rem}
.v .l{margin-top:.4rem;font-weight:600}
.v .t{margin-top:.1rem;font-size:.9rem;color:var(--alive);font-weight:600}
.legend{display:flex;gap:1.4rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;color:var(--muted);font-size:.88rem}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-inline-end:.4rem;vertical-align:middle}

/* ---------- evidence ---------- */
section.block{padding-block:clamp(3rem,8vw,5rem)}
.head{max-width:44rem}
.head h2{font-size:clamp(1.7rem,5vw,2.5rem);margin-top:.6rem}
.honest{display:flex;gap:.8rem;align-items:flex-start;margin-top:1.4rem;padding:1rem 1.2rem;color:#cfdbe1;font-size:.95rem;max-width:44rem}
.honest svg{flex:none;width:1.2rem;height:1.2rem;margin-top:.25rem;color:var(--alive)}
.acc{display:grid;gap:.8rem;margin-top:2rem}
.item{overflow:hidden}
.item > button{width:100%;display:flex;align-items:center;gap:1rem;padding:1.1rem 1.25rem;background:none;border:0;cursor:pointer;text-align:start}
.item .ic{flex:none;width:2.6rem;height:2.6rem;border-radius:14px;display:grid;place-items:center;background:rgba(47,183,224,.12);border:1px solid rgba(47,183,224,.35);color:var(--acrs-2);box-shadow:0 0 20px rgba(47,183,224,.15)}
.item .ic svg{width:1.2rem;height:1.2rem}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;font-size:1.08rem}
.item .tt small{display:block;color:var(--muted);font-size:.86rem;margin-top:.1rem}
.item .chev{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge);transition:transform .35s,background .3s}
.item[data-open="true"] .chev{transform:rotate(180deg);background:rgba(47,183,224,.18);border-color:rgba(47,183,224,.5)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.item[data-open="true"] .panel{grid-template-rows:1fr}
.panel > div{min-height:0;overflow:hidden}
.panel .body{padding:0 1.25rem 1.3rem;border-top:1px solid var(--edge)}
.panel .body > *:first-child{margin-top:1.1rem}
.paper{display:grid;gap:.9rem}
.paper h4{margin:0;font-size:.82rem;color:var(--acrs-2);font-weight:600;letter-spacing:.02em}
.paper p{margin:.15rem 0 0;color:#d5dfe4}
.soon{color:var(--muted);font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.chip{cursor:pointer;padding:.35rem .8rem;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.04);font-size:.86rem;color:var(--muted)}
.chip[aria-pressed="true"]{color:#fff;border-color:rgba(47,183,224,.6);background:rgba(47,183,224,.16)}
.sbtn{cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;padding:.55rem 1rem;border-radius:12px;border:1px solid var(--edge-2);background:rgba(255,255,255,.06);font-weight:600;font-size:.9rem;text-decoration:none;color:var(--text)}
.sbtn:hover{background:rgba(255,255,255,.1)}
.sbtn.go{border-color:rgba(61,220,151,.55);box-shadow:0 0 18px rgba(61,220,151,.2)}
.sbtn svg{width:1rem;height:1rem}
.tablebox{margin-top:1rem;max-height:26rem;overflow:auto;border-radius:14px;border:1px solid var(--edge)}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:40rem}
th,td{padding:.55rem .7rem;text-align:start;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
th{position:sticky;top:0;background:#0d161e;color:var(--muted);font-weight:500;font-size:.78rem;z-index:1}
tr.scan td{background:rgba(47,183,224,.14)}
tr.saved td:first-child{box-shadow:inset 3px 0 0 var(--alive)}
:lang(ar) tr.saved td:first-child{box-shadow:inset -3px 0 0 var(--alive)}
.lv{display:inline-flex;align-items:center;gap:.35rem;padding:.12rem .5rem;border-radius:6px;font-size:.78rem;border:1px solid transparent}
.lv i{width:.45rem;height:.45rem;border-radius:50%;background:currentColor}
.lv-FULL_ISOLATION{color:#ffb08c;background:rgba(240,122,69,.14);border-color:rgba(240,122,69,.35)}
.lv-SURGICAL,.lv-EMERGENCY_RESTRICT{color:#8fe9ff;background:rgba(47,183,224,.14);border-color:rgba(47,183,224,.35)}
.lv-RESTRICT,.lv-COMPENSATING{color:#9ff0c9;background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.3)}
.lv-MONITOR{color:#b7c3ca;background:rgba(255,255,255,.06);border-color:var(--edge)}
.off{color:#ffb08c} .on{color:#9ff0c9}
.tier{font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px solid var(--edge);border-radius:5px;padding:0 .3rem;margin-inline-start:.35rem}
.result{display:none;margin-top:1rem;padding:1rem;border-radius:14px;border:1px solid rgba(61,220,151,.4);background:rgba(61,220,151,.07)}
.result.show{display:block}
.result .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:.6rem}
@media (max-width:640px){.result .grid3{grid-template-columns:1fr}}
.result .cell{padding:.7rem .8rem;border-radius:10px;background:rgba(0,0,0,.2)}
.result .cell b{display:block;font-size:.85rem;color:var(--muted);font-weight:500}
.result .cell span{font-family:var(--mono);font-size:1.25rem;direction:ltr;unicode-bidi:isolate;display:inline-block}
.result .u{color:var(--uniform)} .result .a{color:var(--acrs-2)}
.facts{display:grid;gap:.7rem;margin:0;padding:0;list-style:none}
.facts li{display:flex;gap:.7rem;align-items:flex-start;color:#d5dfe4}
.facts li::before{content:"";flex:none;width:.5rem;height:.5rem;margin-top:.62rem;border-radius:50%;background:var(--acrs);box-shadow:0 0 10px var(--acrs)}
.srcs{display:grid;gap:.6rem;margin:0;padding:0;list-style:none}
.srcs a{text-decoration:none;display:flex;gap:.6rem;align-items:baseline;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.03)}
.srcs a:hover{background:rgba(255,255,255,.07)}
.srcs .k{font-family:var(--mono);color:var(--acrs-2);font-size:.8rem}
.srcs .d{color:#d5dfe4}
.srcs .d small{color:var(--muted)}
.mini{width:100%;min-width:0;font-size:.88rem}
.mini td,.mini th{white-space:normal}
.mini td.n{font-family:var(--mono);direction:ltr;text-align:center}
.nw{white-space:nowrap}
@media (max-width:640px){
  .mini thead{display:none}
  .mini tr{display:grid;grid-template-columns:1fr 3rem 3rem;align-items:center;column-gap:.4rem;padding:.7rem .8rem;border-bottom:1px solid rgba(255,255,255,.07)}
  .mini td{border:0;padding:0}
  .mini td.m{font-weight:600}
  .mini td.n{font-size:1.15rem}
  .mini td.how{grid-column:1/-1;margin-top:.35rem;font-size:.84rem}
}

footer{padding-block:3rem 2.5rem;color:var(--muted);font-size:.88rem;text-align:center}
footer .in{display:grid;gap:.6rem;justify-items:center}
footer button{background:none;border:0;color:var(--acrs-2);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 40%,#0c1720,#04070a 70%);
  transition:opacity .7s ease,visibility .7s}
.intro.done{opacity:0;visibility:hidden}
.intro .stage{position:relative;width:min(92vw,46rem);height:min(80vh,32rem)}
.scene{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;opacity:0;transform:translateY(12px) scale(.98);
  transition:opacity .3s ease,transform .3s ease;pointer-events:none}
.scene.on{opacity:1;transform:none;transition:opacity .55s ease .3s,transform .55s ease .3s}
.monitor{width:min(80vw,26rem)}
.monitor .scr{transition:fill .4s}
.monitor .ln{fill:#1d6d86;opacity:.55}
.monitor .path{fill:none;stroke:var(--breach);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px var(--breach))}
.breached .monitor .path{transition:stroke-dashoffset 1s ease-in;stroke-dashoffset:0}
.breached .monitor .scr{fill:#2a0c12}
.breached .monitor .ln{fill:#7a2230}
.badge{margin-top:1.2rem;display:inline-flex;gap:.55rem;align-items:center;padding:.5rem 1rem;border-radius:999px;border:1px solid rgba(255,77,94,.6);
  color:#ffd2d7;background:rgba(255,77,94,.14);box-shadow:0 0 30px rgba(255,77,94,.35);font-weight:600;opacity:0;transform:scale(.8);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.breached .badge{opacity:1;transform:none;animation:flick .5s steps(2) 2}
@keyframes flick{50%{opacity:.4}}
.stat h2{font-size:clamp(1.4rem,4.5vw,2.1rem);max-width:30rem;margin:0 auto}
.bars{display:grid;gap:.75rem;margin:1.6rem auto 0;width:min(84vw,30rem)}
.bar.hot .val{color:#fff;font-weight:600}
.bar{display:grid;grid-template-columns:3.6rem 1fr 3.2rem;gap:.7rem;align-items:center;font-size:.9rem;color:var(--muted)}
.bar .track{height:.8rem;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .fill{height:100%;width:0;max-width:100%;border-radius:inherit;background:linear-gradient(90deg,#b8323f,var(--breach));box-shadow:0 0 14px rgba(255,77,94,.5);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar .val{font-family:var(--mono);color:#ffd2d7;direction:ltr}
.src{margin-top:1.1rem;font-size:.78rem;color:var(--faint)}
.problem p{font-size:clamp(1.3rem,4.2vw,2rem);max-width:32rem;margin:0 auto;font-weight:500}
.problem p em{font-style:normal;color:var(--uniform)}
.brandmark{font-family:var(--mono);font-weight:600;font-size:clamp(4rem,16vw,8rem);letter-spacing:.06em;
  background:linear-gradient(180deg,#fff,#7fe3ff 55%,#2fb7e0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(47,183,224,.55))}
.brandtag{color:var(--muted);font-size:clamp(1rem,3vw,1.2rem)}
.inav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:3.4rem;height:3.4rem;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  color:#fff;border:1px solid rgba(127,227,255,.35);background:rgba(10,20,28,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 22px rgba(47,183,224,.25);transition:opacity .3s,box-shadow .3s,transform .2s}
.inav svg{width:1.5rem;height:1.5rem}
.inav:hover{box-shadow:0 0 32px rgba(47,183,224,.55)}
.inav:active{transform:translateY(-50%) scale(.94)}
.inav.prev{left:clamp(.6rem,3vw,2rem)} .inav.next{right:clamp(.6rem,3vw,2rem)}
.inav.next{background:linear-gradient(135deg,rgba(47,183,224,.45),rgba(47,183,224,.18));border-color:rgba(127,227,255,.6);animation:nudge 2.2s ease-in-out infinite}
.inav.next.wide{width:auto;padding:0 1.1rem 0 1.3rem;border-radius:999px;gap:.4rem;grid-auto-flow:column;animation:none}
.inav .inlbl{display:none;font-weight:600;font-size:.95rem;white-space:nowrap}
.inav.next.wide .inlbl{display:inline}
.inav[disabled]{opacity:.2;pointer-events:none}
@keyframes nudge{0%,100%{box-shadow:0 0 18px rgba(47,183,224,.3)}50%{box-shadow:0 0 36px rgba(47,183,224,.75)}}
.dots{position:absolute;bottom:clamp(4.6rem,11vh,6rem);inset-inline:0;display:flex;justify-content:center;gap:.5rem;direction:ltr}

(function(){
  var cv=document.getElementById("net"), cx=cv.getContext("2d"), N=[], w=0, h=0, raf=0, dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){ w=cv.clientWidth; h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(Math.min(46,Math.max(18,w/30))); N=[];
    for(var i=0;i<n;i++) N.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()<.12});
  }
  function draw(){
    cx.clearRect(0,0,w,h);
    for(var i=0;i<N.length;i++){ var a=N[i]; a.x+=a.vx; a.y+=a.vy; if(a.x<0||a.x>w)a.vx*=-1; if(a.y<0||a.y>h)a.vy*=-1;
      for(var j=i+1;j<N.length;j++){ var b=N[j], dx=a.x-b.x, dy=a.y-b.y, d=dx*dx+dy*dy;
        if(d<16000){ cx.strokeStyle="rgba(120,210,240,"+(0.12*(1-d/16000))+")"; cx.lineWidth=1; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke(); } } }
    var t=performance.now()/1000;
    for(var k=0;k<N.length;k++){ var p=N[k]; var pulse=p.r?(0.5+0.5*Math.sin(t*1.6+k)):0;
      cx.fillStyle=p.r?"rgba(255,122,90,"+(0.35+0.4*pulse)+")":"rgba(150,225,250,.5)";
      cx.beginPath(); cx.arc(p.x,p.y,p.r?2.2+pulse*1.4:1.5,0,6.283); cx.fill(); }
    if(!reduce) raf=requestAnimationFrame(draw);
  }
  size(); draw();
  addEventListener("resize",function(){cancelAnimationFrame(raf);size();draw();});
  document.addEventListener("visibilitychange",function(){ if(document.hidden)cancelAnimationFrame(raf); else if(!reduce){cancelAnimationFrame(raf);draw();} });
})();
