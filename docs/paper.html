<style>

:root{--bg:#060a0f;--card:rgba(8,14,20,.62);--line:rgba(255,255,255,.12);--text:#ffffff;--muted:#c3d0d7;--acrs:#2fb7e0;--acrs-2:#7fe3ff;--uniform:#f07a45;
 --font:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
:root[lang=en]{--font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.02rem/1.85 var(--font);-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#0d1822 0%,var(--bg) 60%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.o1{width:46vmax;height:46vmax;background:radial-gradient(circle,#1b8fb8 0%,transparent 65%);top:-12vmax;inset-inline-start:-10vmax;animation:drift1 26s ease-in-out infinite alternate}
.o2{width:40vmax;height:40vmax;background:radial-gradient(circle,#c0482f 0%,transparent 65%);bottom:-14vmax;inset-inline-end:-8vmax;opacity:.42;animation:drift2 32s ease-in-out infinite alternate}
.o3{width:30vmax;height:30vmax;background:radial-gradient(circle,#15806a 0%,transparent 65%);top:40%;inset-inline-start:35%;opacity:.3;animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-14vmax,-8vmax) scale(1.15)}}
@keyframes drift3{to{transform:translate(-10vmax,12vmax) scale(.9)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
#net{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.sheet{background:rgba(6,11,16,.58);border:1px solid var(--line);border-radius:22px;padding:1.6rem clamp(1rem,4vw,2.2rem);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
mark{color:#fff;padding:.05em .25em;border-radius:.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone;font-weight:600}
.mk-y{background:linear-gradient(100deg,rgba(255,200,0,.28),rgba(255,200,0,.55) 8%,rgba(255,200,0,.48) 92%,rgba(255,200,0,.24))}
.mk-r{background:linear-gradient(100deg,rgba(255,77,94,.18),rgba(255,77,94,.44) 8%,rgba(255,77,94,.36) 92%,rgba(255,77,94,.16))}
.mk-b{background:linear-gradient(100deg,rgba(47,183,224,.2),rgba(47,183,224,.46) 8%,rgba(47,183,224,.38) 92%,rgba(47,183,224,.18))}
.mklegend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin:1rem 0 0;font-size:.86rem;color:var(--muted)}
.mklegend mark{font-weight:500;font-size:.84rem}
a{color:var(--acrs-2)}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.7rem 16px;background:rgba(6,10,15,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .brand{font-weight:700;letter-spacing:.04em;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:.5rem}
.bar .brand i{width:.55rem;height:.55rem;border-radius:50%;background:var(--acrs);box-shadow:0 0 12px var(--acrs)}
.bar .act{display:flex;gap:.4rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .85rem;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);text-decoration:none;font:500 .88rem var(--font);cursor:pointer}
.btn:hover{border-color:rgba(127,227,255,.5);box-shadow:0 0 18px rgba(47,183,224,.25)}
.btn svg{width:1rem;height:1rem}
@media (max-width:560px){.bar .brand i{display:none}.bar{padding:.55rem 10px}.bar .act{flex-wrap:nowrap;gap:.3rem}.btn{padding:.34rem .6rem;font-size:.78rem;white-space:nowrap}.btn svg{width:.85rem;height:.85rem}.bar .brand{font-size:.9rem}}
.btn.pri{background:linear-gradient(135deg,rgba(47,183,224,.35),rgba(47,183,224,.12));border-color:rgba(127,227,255,.45)}
main{max-width:860px;margin:0 auto;padding:1.6rem 12px 4rem}
.kicker{font:600 .78rem var(--mono);letter-spacing:.12em;color:var(--acrs-2);text-transform:uppercase}

.sub{color:var(--acrs-2);font-weight:600;margin:0}
.by{color:var(--muted);margin:.4rem 0 0}
.note{margin:1.2rem 0 0;padding:.7rem 1rem;border-radius:12px;border:1px dashed rgba(127,227,255,.35);color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.2rem 1.4rem;margin:1.6rem 0}
.card h2{margin-top:0}
.kw{color:var(--muted);font-size:.88rem;margin:.6rem 0 0}
.toc ol{margin:.2rem 0 0;padding-inline-start:1.3rem;columns:2;column-gap:2rem}
.toc a{color:var(--text);text-decoration:none}.toc a:hover{color:var(--acrs-2)}
@media (max-width:560px){.toc ol{columns:1}}
h2{font-size:1.32rem;margin:2.4rem 0 .6rem;display:flex;gap:.6rem;align-items:baseline}
h2 .n{font:600 .9rem var(--mono);color:var(--acrs)}
p{margin:.55rem 0}
ol,ul{padding-inline-start:1.4rem;margin:.5rem 0}
li{margin:.25rem 0}
.box{border-inline-start:3px solid var(--acrs);background:rgba(47,183,224,.08);padding:.8rem 1rem;border-radius:10px;font-weight:600;margin:.8rem 0}
.tw{overflow-x:auto;margin:1rem 0}

.rules{table-layout:fixed}.rules th:nth-child(1){width:6%}.rules th:nth-child(2){width:40%}.rules th:nth-child(3){width:54%}
caption{caption-side:top;text-align:start;color:var(--muted);font-size:.85rem;padding-bottom:.4rem}

.u{color:var(--uniform)}.a{color:var(--acrs-2)}

figcaption{color:var(--muted);font-size:.86rem;margin-top:.4rem}
svg text{font-family:var(--font);fill:var(--muted);font-size:12px}
svg .v{font-family:var(--mono);font-weight:600;fill:var(--text)}
.leg{display:flex;gap:1rem;font-size:.84rem;color:var(--muted);margin-bottom:.3rem}
.leg i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;vertical-align:-.1rem;margin-inline-end:.35rem}
.refs li{font-size:.9rem;color:var(--muted)}
.bdi{unicode-bidi:isolate}
footer{color:var(--muted);font-size:.84rem;text-align:center;padding:2rem 16px 3rem;border-top:1px solid var(--line)}
@media print{
 :root{--bg:#fff;--card:#f6f8f9;--line:#d9e0e4;--text:#12202a;--muted:#4c5d68;--acrs:#1386ad;--acrs-2:#0e6f90;--uniform:#d35d25;color-scheme:light}
 body{font-size:10.5pt;line-height:1.7}
 .bg,.bar,.toc,footer .noprint{display:none}
 .sheet{background:none;border:0;box-shadow:none;padding:0;backdrop-filter:none}

 .mk-y{background:#ffe680}.mk-r{background:#ffc9cf}.mk-b{background:#c7ecf8}
 main{max-width:none;padding:0}
 h2{break-after:avoid;margin-top:1.4rem}
 figure,.box{break-inside:avoid}
 .tw{overflow:visible}
 table{break-inside:auto} tr{break-inside:avoid} thead{display:table-header-group}
 p:has(+ .tw),h2{break-after:avoid}
 section:has(> h2 + .tw) > h2 + .tw, table.sm{break-inside:avoid}
 .tw:has(table.sm){break-inside:avoid}
 .card{margin:1rem 0}
 a{color:inherit;text-decoration:none}
 @page{size:A4;margin:16mm 16mm 18mm}
}

.cover{display:none}
@media print{
 .cover{display:flex;flex-direction:column;height:262mm;break-after:page;background:linear-gradient(160deg,#0b2733 0%,#0a1820 55%,#241310 100%);color:#fff;border-radius:6px;padding:22mm 18mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .cover ~ .kicker,.cover ~ h1,.cover ~ .sub,.cover ~ .by{display:none}
 .cv-k{font:600 9pt var(--mono);letter-spacing:.18em;color:#7fe3ff;text-transform:uppercase}
 .cv-brand{font:700 64pt var(--mono);letter-spacing:.05em;margin-top:28mm;color:#bff0ff}
 .cv-t{font-size:19pt;font-weight:700;line-height:1.35;margin-top:4mm;max-width:150mm}
 .cv-s{font-size:12pt;color:#9fe7fb;margin-top:4mm}
 .cv-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;margin-top:auto}
 .cv-nums div{border:1px solid rgba(255,255,255,.25);border-radius:4mm;padding:5mm;background:rgba(255,255,255,.06)}
 .cv-nums b{display:block;font:700 20pt var(--mono);color:#fff}
 .cv-nums span{font-size:9.5pt;color:#cfe3ea}
 .cv-by{margin-top:10mm;font-size:11pt;color:#e7eef1;line-height:1.6}
 .cv-note{margin-top:3mm;font-size:8.5pt;color:#9fb0ba}
 h2{border-bottom:2px solid #d9e0e4;padding-bottom:1.5mm}
 h2 .n{display:inline-grid;place-items:center;width:7mm;height:7mm;border-radius:50%;background:#1386ad;color:#fff;font-size:9pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 figure{border:1px solid #d9e0e4;background:#fbfcfc;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 thead th{background:#eef3f5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .card{border:1px solid #d9e0e4;background:#f7fafb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>

window.PAPER_DOC = {
ar:{
 dir:"rtl",
 kicker:"ورقة بحثية",
 title:"تصميم وتقييم نموذج احتواء سيبراني يتكيّف مع خطورة الهجوم وأهمية الجهاز",
 sub:"ACRS: نظام الاستجابة السيبرانية المتكيّفة · يوقف الهجوم… لا المستشفى",
 by:"بحث وتطوير: حسان عبدالله الينبعاوي",
 date:"2026",
 note:"كل البيانات في هذه الورقة من محاكاة. لم تُلمس أي شبكة حقيقية.",
 toc:"المحتويات", mk:["نتيجة مهمة","مشكلة أو تحذير","ما يضيفه ACRS"], back:"الرجوع للموقع", pdf:"تنزيل PDF", lang:"English",
 abs_t:"الملخص",
 abs:"عندما يُخترق جهاز في منشأة، تعزله أغلب أنظمة الرد الآلي عزلًا كاملًا عن الشبكة. هذا يوقف المهاجم، لكنه [[r:قد يوقف معه خادم الدخول الذي يعتمد عليه كل الموظفين، أو جهازًا طبيًا يعتمد عليه مريض]]. يقترح هذا البحث نظامًا اسمه ACRS [[b:يختار أخف رد يكفي لإيقاف المهاجم]]، بناءً على ثلاثة أشياء: خطورة الهجوم، ومدى التأكد منه، وأهمية الجهاز. قارنّا ACRS بالطريقة المعتادة، وهي عزل كامل لأي جهاز تتجاوز خطورته 60، في تجربة محاكاة من 42 حادثة وبنفس المدخلات تمامًا. النتيجة: [[y:توقف 20 جهازًا بدل 37، وتوقف نظامان مهمان بدل 7، وأُوقف المهاجم في 36 هجومًا من 41 في الطريقتين]]. ولم ينجح أي رقم ثابت بين 50 و100 في تحقيق النتيجتين معًا. وفي تجربة ثانية من 8 جولات يغيّر فيها المهاجم أسلوبه، [[y:نجحت كل خدعة جديدة مرة واحدة فقط]] بعد أن تعلّم ACRS من رد المهندس. [[r:الثمن هو تدخل بشري في مواضع محددة]].",
 kw:"كلمات مفتاحية: الاستجابة للحوادث، الاحتواء، الرد الآلي، أهمية الأصول، الفدية",
 fig:"شكل", tab:"جدول",
 sections:[
 {t:"المقدمة والمشكلة", b:[
  ["p","الهجمات الإلكترونية صارت أسرع وأخطر. في تقارير Verizon السنوية، ارتفعت نسبة الاختراقات التي فيها برامج فدية [[r:من 25% في 2022 إلى 48% في 2026]] [1]. وتقول CrowdStrike إن متوسط الوقت الذي يحتاجه المهاجم لينتقل من أول جهاز إلى أجهزة أخرى كان [[r:29 دقيقة]] في 2025 [2]. ومتوسط تكلفة الاختراق عالميًا [[r:4.99 مليون دولار]] [3]."],
  ["p","لأن المهاجم سريع، تعتمد المنشآت على أنظمة رد آلي تتحرك في ثوانٍ بدل انتظار إنسان. والرد الأشهر في هذه الأنظمة بسيط: اعزل الجهاز المصاب عزلًا كاملًا عن الشبكة."],
  ["p","المشكلة أن هذا الرد واحد لكل الأجهزة. عزل جهاز موظف لا يضر أحدًا، [[r:لكن عزل خادم الدخول يوقف كل الموظفين، وعزل جهاز طبي قد يضر مريضًا]]. وإرشادات الاستجابة للحوادث توصي أصلًا بأن يراعي قرار الاحتواء أثره على الخدمات [4]. إذن السؤال ليس: هل نوقف المهاجم؟ بل: [[b:ما أخف رد يكفي لإيقافه؟]]"]]},
 {t:"سؤال البحث والفرضية", b:[
  ["box","سؤال البحث: هل يمكن لنظام يوازن بين خطورة الهجوم وأهمية الجهاز أن يوقف أجهزة أقل من العزل الكامل، ويوقف المهاجم بنفس القوة؟"],
  ["p","الفرضية: النظام الذي يراعي أهمية الجهاز يوقف أجهزة أقل وأنظمة مهمة أقل، دون أن يقل عدد الهجمات التي يوقف فيها المهاجم."],
  ["p","الفرضية الصفرية: لا فرق في عدد الأجهزة المتوقفة، أو أن ACRS يوقف المهاجم في عدد أقل من الهجمات."],
  ["p","الأهداف:"],
  ["ol",["بناء ACRS كنظام قرار بقواعد واضحة يمكن فحصها وشرح كل قرار فيها.","اختباره أمام العزل الكامل على نفس الهجمات المحاكاة.","قياس عدد الأجهزة المتوقفة، وإيقاف المهاجم، والسرعة، والجهد البشري المطلوب."]]]},
 {t:"كيف يعمل ACRS", b:[
  ["p","يمر كل تنبيه في ACRS بثماني مراحل. التجربة تغيّر المرحلة الخامسة فقط، أي القرار:"],
  ["ol",["الاكتشاف: 12 قاعدة تقرأ من 8 أنواع من الحساسات.","الربط: جمع الأحداث المرتبطة خلال 5 دقائق في حادثة واحدة.","حساب الخطورة: درجة من 0 إلى 100 من 6 عوامل.","أهمية الجهاز: هل هو أساسي أو مهم أو عادي؟ هل له بديل؟ هل هو جهاز سلامة؟","القرار: 9 قواعد مرتبة، بدون ذكاء اصطناعي.","الاحتواء: تنفيذ الأمر خلال مهلة 7 أو 15 أو 90 ثانية حسب أهمية الجهاز.","التحقق: 9 فحوص تتأكد أن الاحتواء نجح.","الرجوع: يعود الجهاز للعمل على مراحل."]],
  ["p","الأجهزة في ACRS ثلاثة مستويات: أساسية (Tier-0) مثل خوادم الدخول والشهادات، ومهمة (Tier-1) مثل قواعد البيانات والأجهزة الطبية، وعادية (Tier-2) مثل أجهزة الموظفين."],
  ["fig","arch"],
  ["p","قواعد القرار التسع بالترتيب، وأول قاعدة تنطبق هي التي تحكم:"],
  ["table",{h:["#","إذا كان…","فإن ACRS…"],r:[
   ["1","الجهاز غير معروف","يحجب عنوانه عند حدود الشبكة فقط"],
   ["2","الجهاز لا يجوز إطفاؤه (طبي أو صناعي)","يحجب المهاجم من الشبكة ويترك الجهاز يعمل"],
   ["3","الهجوم فدية","يتحرك فورًا: الأساسي يُقيَّد، والمهم يُعزل ويعمل بديله، والعادي يُعزل كاملًا"],
   ["4","التأكد أقل من 60% (وحساس واحد لا يتجاوز 55%)","لا يعزل وحده، وينتظر إنسانًا"],
   ["5","الخطورة أقل من 60","يراقب فقط"],
   ["6","الجهاز في وقت صيانة معتمد","يقيّد وينتظر تأكيدًا"],
   ["7","الخطورة فوق حد الجهاز (أساسي 95، مهم 90، عادي 85)","أساسي: تقييد فوري وشخصان للعزل الكامل. مهم: عزل والبديل يعمل. عادي: عزل كامل"],
   ["8","الخطورة متوسطة","يقيّد وحده، والخطوة الأقوى تحتاج إنسانًا. الأساسي: مراقبة وشخصان"],
   ["9","حصلت 5 احتواءات آلية أو أكثر خلال 10 دقائق","يوقف الآلية مؤقتًا حتى لا يعزل المنشأة كلها"]]}],
  ["p","ما يضيفه ACRS: العزل الآلي موجود في أدوات الأمن التجارية، ولا ندّعي أننا اخترعناه. ما يضيفه هذا البحث هو [[b:نموذج قرار واضح يحدد قوة الرد من الخطورة والتأكد وأهمية الجهاز]]، وتجربة مضبوطة تقارنه بالعزل الكامل."]]},
 {t:"طريقة التجربة", b:[
  ["p","التجربة من ذراعين: كل حادثة تمر على الطريقتين بنفس المعلومات تمامًا، أي نفس الاكتشاف ونفس درجة الخطورة ونفس درجة التأكد. [[y:الشيء الوحيد المختلف هو القرار]]."],
  ["fig","design"],
  ["p","الطريقة المعتادة (خط الأساس): إذا كانت الخطورة 60 أو أكثر، أو الهجوم فدية سريعة، يُعزل الجهاز عزلًا كاملًا فورًا. غير ذلك: مراقبة. اخترنا 60 لأنه نفس الحد الأدنى الذي يستخدمه ACRS، حتى تكون المقارنة عادلة."],

  ["p","البيانات: 40 سيناريو هجوم في 8 أنواع، نتجت عنها 42 حادثة: 41 هجومًا وحالة سليمة واحدة (عمل صيانة مشروع يشبه الهجوم). الأجهزة 20: 4 أساسية، و10 مهمة منها جهاز رنين مغناطيسي، و6 عادية. تراوحت الخطورة بين 40 و99، ورأى كل حادثة من 1 إلى 4 حساسات."],

  ["p","قرارات ACRS على الـ42 حادثة: 17 تقييد والجهاز يعمل، و9 عزل ذكي، و7 عزل كامل، و4 تقييد فوري، و4 مراقبة، وحالة واحدة حجب من الشبكة فقط. أما الطريقة المعتادة فعزلت 37 عزلًا كاملًا وراقبت 5."],

 {t:"التجربة الثانية: لا يوجد معنى للفشل", b:[

  ["p","الطريقة: 8 جولات، في كل جولة نفس الـ41 هجومًا، ويغيّر المهاجم أسلوبه كل جولتين: الهجمات الأصلية، ثم عناوين جديدة لا تعرفها قوائم التهديدات، ثم التخفّي عن أحد الحساسات، ثم الخدعتان معًا. كل نسخة تمر على نفس محركات النظام بدون تعديل. بعد كل جولة، كل هجوم لم يتوقف تلقائيًا يعالجه المهندس (محاكى، ونفترض أنه يعرف الهجوم صح)، ويُحفظ رده."],

  ["fig","learn"],
  ["p","النتيجة: [[y:كل خدعة جديدة نجحت مرة واحدة فقط]]. في كل جولة تكرار نزل العدد إلى 4، و[[y:الأربعة كلها خوادم أساسية]] ينتظر فيها ACRS قرار إنسان عن قصد. أي أن الهجمات التي تفلت في بقية الأجهزة وصلت إلى صفر. ولم يُستخدم الرد المتعلَّم ولا مرة على الحالة السليمة ولا على خادم أساسي."],

 {t:"المناقشة", b:[

  ["p","[[r:الثمن الأول:]] قطع ACRS طرقًا أقل نحو الأنظمة المهمة (30 بدل 36). هذا مقصود: 4 خوادم أساسية تنتظر موافقة شخصين، وجهاز طبي لم يُطفأ، وتنبيه رآه حساس واحد فقط. لكنه تنازل حقيقي ونذكره بوضوح."],
  ["p","[[r:الثمن الثاني:]] الجهد البشري. يؤكد شخص رجوع الجهاز في 16 حالة، وتنتظر 4 خوادم أساسية موافقة شخصين، وحالتان تنتظران إنسانًا قبل أي احتواء (الحالة السليمة وتنبيه الحساس الواحد). الطريقة المعتادة لا تحتاج أحدًا، لكنها تعزل خوادم أساسية دون أي قرار بشري."],
  ["p","[[r:ما زال ACRS يوقف نظامين مهمين]]: قاعدة بيانات ERP-DB-01 وخادم الشهادات PKI-CA-01. هذان جهازان بلا بديل وكان الخطر عليهما عاليًا."]]},
 {t:"حدود البحث", b:[
  ["ol",["البيانات محاكاة: 40 سيناريو على 20 جهازًا افتراضيًا.","أثر التوقف محسوب من وصف الأجهزة، وليس مقاسًا على خدمات تعمل فعلًا.","أوزان الخطورة محددة بالتصميم، ولم تُضبط على هجمات حقيقية.","[[r:نفس الشخص كتب السيناريوهات والقواعد، وهذا قد يميل لصالح ACRS]]. وهذا أهم قيد في البحث.","زمن الاحتواء مقاس على أدوات محاكاة بزمن واقعي، وليس على أدوات حقيقية.","ACRS يقطع طرقًا أقل (30 بدل 36)، وهذا تنازل مقصود لكنه حقيقي.","في تجربة التعلّم، المهندس محاكى ونفترض أنه يعرف الهجوم صح، والخدع مولّدة من نفس الهجمات وليست هجمات جديدة كليًا."]]]},

en:{
 dir:"ltr",
 kicker:"Research paper",
 title:"Design and Evaluation of a Risk-Adaptive Cyber Containment Model Based on Threat Severity and Asset Criticality",
 sub:"ACRS: Adaptive Cyber Response System · Stops the attack, not the hospital",
 by:"Research & development: Hassan Abdullah Alyenbawi",
 date:"2026",
 note:"All data in this paper is simulated. No real network was touched.",
 toc:"Contents", mk:["Key result","Problem or warning","What ACRS adds"], back:"Back to site", pdf:"PDF", lang:"العربية",
 abs_t:"Abstract",
 abs:"When a machine in an organization is hacked, most automated response tools fully isolate it from the network. That stops the attacker, but [[r:it can also stop the login server every employee depends on, or a medical device a patient depends on]]. This research proposes a system called ACRS that [[b:picks the lightest response that still stops the attacker]], based on three things: how dangerous the attack is, how sure we are, and how important the machine is. We compared ACRS with the usual way, full isolation of any machine whose danger score passes 60, in a simulated test of 42 incidents with exactly the same inputs. Result: [[y:20 machines stopped instead of 37, 2 important systems stopped instead of 7, and the attacker stopped in 36 of 41 attacks with both approaches]]. No fixed number from 50 to 100 achieved both results. In a second, 8-round experiment where the attacker changes tactics, [[y:each new trick worked only once]] after ACRS learned from the engineer's response. [[r:The cost is human involvement at specific points]].",
 kw:"Keywords: incident response, containment, automated response, asset criticality, ransomware",
 fig:"Figure", tab:"Table",
 sections:[
 {t:"Introduction and the problem", b:[
  ["p","Cyber attacks are getting faster and more damaging. In Verizon's yearly reports, the share of breaches involving ransomware rose [[r:from 25% in 2022 to 48% in 2026]] [1]. CrowdStrike reports that the average time an attacker needs to move from the first machine to others was [[r:29 minutes]] in 2025 [2]. The global average cost of a breach is [[r:$4.99 million]] [3]."],
  ["p","Because attackers are fast, organizations rely on automated response tools that act in seconds instead of waiting for a person. The most common response in these tools is simple: fully isolate the infected machine from the network."],
  ["p","The problem is that this is one response for every machine. Isolating an employee's laptop hurts no one, [[r:but isolating the login server stops every employee, and isolating a medical device can hurt a patient]]. Incident response guidance already says a containment decision should consider its impact on services [4]. So the question is not whether to stop the attacker, but [[b:what is the lightest response that still stops them?]]"]]},
 {t:"Research question and hypothesis", b:[
  ["box","Research question: Can a system that weighs how dangerous the attack is and how important the machine is stop fewer machines than full isolation, and still stop the attacker just as often?"],
  ["p","Hypothesis: a system that considers how important the machine is will stop fewer machines and fewer important systems, without stopping the attacker any less often."],
  ["p","Null hypothesis: there is no difference in machines stopped, or ACRS stops the attacker in fewer attacks."],
  ["p","Objectives:"],
  ["ol",["Build ACRS as a decision system with clear rules that can be checked, with a written reason for every decision.","Test it against full isolation on the same simulated attacks.","Measure machines stopped, attackers stopped, speed, and the human effort needed."]]]},
 {t:"How ACRS works", b:[
  ["p","Every alert in ACRS goes through eight stages. The experiment changes only stage five, the decision:"],
  ["ol",["Detect: 12 rules reading from 8 kinds of sensors.","Connect: related events within 5 minutes are grouped into one incident.","Score danger: a score from 0 to 100 from 6 factors.","Machine importance: is it core, important or ordinary? Does it have a backup? Is it a safety device?","Decide: 9 ordered rules, no AI.","Contain: carry out the command within 7, 15 or 90 seconds depending on the machine.","Check: 9 checks confirm the containment worked.","Return: the machine comes back to work in stages."]],
  ["p","Machines in ACRS have three levels: core (Tier-0) such as login and certificate servers, important (Tier-1) such as databases and medical devices, and ordinary (Tier-2) such as employee laptops."],
  ["fig","arch"],
  ["p","The nine decision rules, in order. The first rule that applies decides:"],
  ["table",{h:["#","If…","then ACRS…"],r:[
   ["1","the machine is unknown","blocks its address at the network edge only"],
   ["2","the machine must not be switched off (medical or industrial)","blocks the attacker on the network and leaves the machine running"],
   ["3","the attack is ransomware","acts at once: core is restricted, important is isolated while its backup runs, ordinary is fully isolated"],
   ["4","certainty is below 60% (one sensor is capped at 55%)","does not isolate on its own and waits for a person"],
   ["5","danger is below 60","watches only"],
   ["6","the machine is in an approved maintenance window","restricts and waits for confirmation"],
   ["7","danger is above the machine's limit (core 95, important 90, ordinary 85)","core: immediate restriction, two people for full isolation. Important: isolated while the backup runs. Ordinary: full isolation"],
   ["8","danger is medium","restricts on its own; a stronger step needs a person. Core: watch, and two people"],
   ["9","5 or more automatic containments happened within 10 minutes","pauses automation so it does not isolate the whole organization"]]}],
  ["p","What ACRS adds: automatic isolation already exists in commercial security tools, and we do not claim to have invented it. What this research adds is [[b:a clear decision model that sets how strong the response is from danger, certainty and machine importance]], and a controlled test comparing it with full isolation."]]},
 {t:"How we tested it", b:[
  ["p","The experiment has two arms: every incident goes through both approaches with exactly the same information, meaning the same detection, the same danger score and the same certainty. [[y:The only thing that changes is the decision]]."],
  ["fig","design"],
  ["p","The usual way (baseline): if danger is 60 or more, or the attack is fast ransomware, the machine is fully isolated at once. Otherwise it is watched. We chose 60 because it is the same minimum ACRS uses, so the comparison is fair."],
  ["table",{h:["Type","Variable"],r:[
   ["Independent (what we changed)","The response approach: the usual way or ACRS"],
   ["Dependent (what we measured)","Machines stopped, important systems stopped, medical devices switched off, core servers isolated with no person, the harmless case, attacker stopped, paths cut, response speed, human effort"],
   ["Controlled","Same scenarios, same detection, same danger and certainty scoring, same machine list, same way of turning a decision into commands, same way of counting"]]}],
  ["p","Data: 40 attack scenarios of 8 types, producing 42 incidents: 41 attacks and one harmless case (legitimate maintenance that looks like an attack). There are 20 machines: 4 core, 10 important including an MRI controller, and 6 ordinary. Danger ranged from 40 to 99, and each incident was seen by 1 to 4 sensors."],
  ["table",{h:["Attack type","Incidents"],r:[["Ransomware","7"],["Attacker command channel","6"],["Identity theft","5"],["Initial access","5"],["Edge cases","5"],["Cloud & containers","5"],["Web apps & APIs","5"],["Insider data theft","4"]]}],
  ["p","How we counted: not from the decision's name, but from the commands each approach actually issued. For example, we only count the attacker as stopped if a command cut their outside connection."],
  ["p","Reproducibility: the system has no randomness, so re-running the experiment [[y:gives exactly the same numbers]]. The rules file fingerprint is 87893ca0, and 6 automated tests check on every run that the results have not changed."]]},
 {t:"Results", b:[
  ["table",{cap:"Main results on 42 incidents",h:["What we measured","The usual way","ACRS"],r:[
   ["Machines stopped","37","20"],["Important systems stopped","7","2"],["Attacker stopped (of 41 attacks)","36","36"],["Paths to important systems cut","36","30"],["Medical devices switched off","1","0"],["Core servers isolated with no person","4","0"],["Harmless case stopped by mistake","1","0"]]}],
  ["fig","bars"],
  ["p","ACRS stopped the attacker in the same number of attacks (36 of 41), but stopped 20 machines instead of 37, [[y:which is 46% fewer]]. Important systems stopped [[y:fell from 7 to 2]]."],
  ["p","Is it enough to raise the isolation number in the usual way? We tried every number from 50 to 100:"],
  ["table",{cap:"The usual way with different isolation numbers",h:["Isolation number","Important systems stopped","Attacker stopped"],r:[["50","7","38"],["55","7","37"],["60","7","36"],["65","7","34"],["70","7","33"],["75 and 80","5","32"],["85","5","24"],["90","2","18"],["95","2","10"],["100","1","7"],["ACRS","2","36"]]}],
  ["fig","sweep"],
  ["p","To get down to 2 important systems stopped, the usual way needs the number 90, and then [[r:it stops the attacker in only 18 attacks]]. [[b:Only ACRS achieved 2 and 36 together]]."],
  ["p","ACRS decisions across the 42 incidents: 17 restricted while working, 9 smart isolation, 7 full isolation, 4 immediate restriction, 4 watch, and 1 blocked on the network only. The usual way fully isolated 37 and watched 5."],
  ["p","Speed: across 5 full runs, time to contain was [[y:0.29 to 0.34 seconds for both approaches]], and no containment missed its deadline in 365 actions. The decision itself takes about 2 microseconds in ACRS and 0.8 in the usual way, so the time difference is negligible."]]},
 {t:"Second experiment: failure is never final", b:[
  ["p","When ACRS does not stop an attack automatically, an engineer handles it by hand. This experiment asks: [[b:if ACRS saves the engineer's response and reuses it on similar attacks, how many attacks get through when the same attacks come back, even if the attacker changes tactics?]]"],

      else if(b[0]==="fig"){fn++;var FF={bars:[bars,t.fig_bars],sweep:[sweep,t.fig_sweep],learn:[learn,t.fig_learn],arch:[arch,t.fig_arch],design:[design,t.fig_design]}[b[1]];h+='<figure>'+FF[0](t)+'<figcaption>'+esc(t.fig)+' '+fn+': '+esc(FF[1])+'</figcaption></figure>';}
    });
    h+='</section>';
  });
  h+='<section id="refs"><h2>'+esc(t.ref_t)+'</h2><ol class="refs">'+t.refs.map(function(r){return '<li>'+tx(r)+'</li>';}).join("")+'</ol></section>';
  document.getElementById("doc").innerHTML=h;
  document.getElementById("back").textContent=t.back;
  document.getElementById("lang").textContent=t.lang;
  var pdf=document.getElementById("pdf");pdf.href="data/ACRS_Paper_"+(lang==="ar"?"AR":"EN")+".pdf";pdf.querySelector("span").textContent=t.pdf;
  document.getElementById("copy").textContent=(lang==="ar"?"© 2026 حسان عبدالله الينبعاوي. جميع الحقوق محفوظة.":"© 2026 Hassan Abdullah Alyenbawi. All rights reserved.");
}
document.getElementById("lang").addEventListener("click",function(){lang=lang==="ar"?"en":"ar";set("acrs_lang",lang);render();});
render();
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* ================= background network ================= */
(function(){
  var cv=document.getElementById("net"), cx=cv.getContext("2d"), N=[], w=0, h=0, raf=0, dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){ w=cv.clientWidth; h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(Math.min(46,Math.max(18,w/30))); N=[];
    for(var i=0;i<n;i++) N.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()<.12});
  }
  function draw(){
    cx.clearRect(0,0,w,h);
    for(var i=0;i<N.length;i++){ var a=N[i]; a.x+=a.vx; a.y+=a.vy; if(a.x<0||a.x>w)a.vx*=-1; if(a.y<0||a.y>h)a.vy*=-1;
      for(var j=i+1;j<N.length;j++){ var b=N[j], dx=a.x-b.x, dy=a.y-b.y, d=dx*dx+dy*dy;
        if(d<16000){ cx.strokeStyle="rgba(120,210,240,"+(0.12*(1-d/16000))+")"; cx.lineWidth=1; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke(); } } }
    var t=performance.now()/1000;
    for(var k=0;k<N.length;k++){ var p=N[k]; var pulse=p.r?(0.5+0.5*Math.sin(t*1.6+k)):0;
      cx.fillStyle=p.r?"rgba(255,122,90,"+(0.35+0.4*pulse)+")":"rgba(150,225,250,.5)";
      cx.beginPath(); cx.arc(p.x,p.y,p.r?2.2+pulse*1.4:1.5,0,6.283); cx.fill(); }
    if(!reduce) raf=requestAnimationFrame(draw);
  }
  size(); draw();
  addEventListener("resize",function(){cancelAnimationFrame(raf);size();draw();});
  document.addEventListener("visibilitychange",function(){ if(document.hidden)cancelAnimationFrame(raf); else if(!reduce){cancelAnimationFrame(raf);draw();} });
})();
})();
</script>
