</svg>
<script>
const rows=[["ACRS",70,true],["نسخة ACRS القديمة",90,false],["قاعدة بسيطة",126,false],["قطع الشبكة كلها",268,false]];

 const l=document.createElementNS(ns,'text');l.setAttribute('x',right-w-10);l.setAttribute('y',y+43);l.setAttribute('text-anchor','end');l.setAttribute('font-size',27);l.setAttribute('font-weight',600);l.setAttribute('fill','#1C2328');l.textContent=v;g.appendChild(l);
